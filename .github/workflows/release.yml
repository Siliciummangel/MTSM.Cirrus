name: Release

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  packages: write
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release-please:
    name: Prepare or create release
    runs-on: ubuntu-latest
    outputs:
      release-created: ${{ steps.release.outputs.release_created }}
      tag-name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      release-sha: ${{ steps.release.outputs.sha }}
    steps:
      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish-images:
    name: Publish release images
    needs: release-please
    if: needs.release-please.outputs.release-created == 'true'
    uses: ./.github/workflows/containers.yml
    with:
      release-version: ${{ needs.release-please.outputs.version }}
      release-sha: ${{ needs.release-please.outputs.release-sha }}
    secrets: inherit

  publish-release:
    name: Publish GitHub release
    needs: [release-please, publish-images, promote-release-tags]
    if: needs.release-please.outputs.release-created == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.release-sha }}

      - name: Combine manual and generated release notes
        id: notes
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag-name }}
        run: |
          set -euo pipefail

          release_id="$(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              --jq ".[] | select(.tag_name == \"${TAG}\") | .id" \
              | head -n 1
          )"

          if [[ -z "$release_id" ]]; then
            echo "Draft release for ${TAG} was not found." >&2
            exit 1
          fi

          gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
            --jq .body > generated-notes.md

          awk '
            /<!--/ { in_comment = 1; next }
            /-->/  { in_comment = 0; next }
            !in_comment { print }
          ' docs/release-notes/current.md > manual-notes.md

          if grep -q '[^[:space:]]' manual-notes.md; then
            {
              cat manual-notes.md
              printf '\n## Changes\n\n'
              cat generated-notes.md
            } > final-notes.md
          else
            cp generated-notes.md final-notes.md
          fi

          echo "release-id=$release_id" >> "$GITHUB_OUTPUT"

      - name: Publish stable release
        if: ${{ !contains(needs.release-please.outputs.version, '-') }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag-name }}
        run: gh release edit "$TAG" --notes-file final-notes.md --draft=false --latest

      - name: Publish prerelease
        if: ${{ contains(needs.release-please.outputs.version, '-') }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag-name }}
        run: gh release edit "$TAG" --notes-file final-notes.md --draft=false --prerelease

  promote-release-tags:
    name: Promote tested release images
    needs: [release-please, publish-images]
    if: needs.release-please.outputs.release-created == 'true'
    runs-on: ubuntu-latest
    env:
      IMAGE_PREFIX: ghcr.io/siliciummangel/mtsm-cirrus
      VERSION: ${{ needs.release-please.outputs.version }}
      RELEASE_SHA: ${{ needs.release-please.outputs.release-sha }}
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish immutable and moving release tags
        shell: bash
        run: |
          set -euo pipefail

          short_sha="${RELEASE_SHA:0:7}"

          for service in api worker migrate admin; do
            image="${IMAGE_PREFIX}-${service}"
            source="${image}:sha-${short_sha}"

            tags=(--tag "${image}:${VERSION}")
            if [[ "$VERSION" != *-* ]]; then
              IFS='.' read -r major minor _ <<< "$VERSION"
              tags+=(
                --tag "${image}:${major}.${minor}"
                --tag "${image}:${major}"
                --tag "${image}:stable"
              )
            fi

            docker buildx imagetools create "${tags[@]}" "$source"
          done
