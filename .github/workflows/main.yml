name: .NET CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dotnet-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: cirrus_test
          POSTGRES_USER: cirrus
          POSTGRES_PASSWORD: cirrus-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cirrus -d cirrus_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      CI: "true"
      CIRRUS_TEST_POSTGRES: >-
        Host=localhost;Port=5432;Database=cirrus_test;Username=cirrus;Password=cirrus-test-password
      CIRRUS_TEST_S3_SERVICE_URL: http://127.0.0.1:8333
      CIRRUS_TEST_S3_ACCESS_KEY: cirrus-test-access
      CIRRUS_TEST_S3_SECRET_KEY: cirrus-test-secret-key
      CIRRUS_TEST_S3_REGION: us-east-1

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Start S3-compatible storage
        run: |
          docker run --detach --rm \
            --name cirrus-seaweedfs \
            --publish 8333:8333 \
            --env AWS_ACCESS_KEY_ID=cirrus-test-access \
            --env AWS_SECRET_ACCESS_KEY=cirrus-test-secret-key \
            --env S3_BUCKET=cirrus-test-bootstrap \
            chrislusf/seaweedfs:4.42

          for _ in {1..30}; do
            if curl --silent --output /dev/null http://127.0.0.1:8333; then
              exit 0
            fi

            sleep 1
          done

          docker logs cirrus-seaweedfs
          exit 1

      - name: Restore dependencies
        run: dotnet restore MTSM.Cirrus.slnx

      - name: Audit NuGet dependencies
        run: |
          audit_report="$(dotnet package list \
            --project MTSM.Cirrus.slnx \
            --vulnerable \
            --include-transitive \
            --format json \
            --output-version 1 \
            --no-restore)"

          printf '%s\n' "$audit_report"

          vulnerability_count="$(
            jq '[
              ..
              | objects
              | select(.vulnerabilities? != null)
              | .vulnerabilities[]
            ] | length' <<< "$audit_report"
          )"

          if [ "$vulnerability_count" -ne 0 ]; then
            echo "Found $vulnerability_count known NuGet vulnerability entries."
            exit 1
          fi

      - name: Build release
        run: >
          dotnet build MTSM.Cirrus.slnx
          --configuration Release
          --no-restore

      - name: Run tests
        run: >
          dotnet test MTSM.Cirrus.slnx
          --configuration Release
          --no-build
          --verbosity normal
