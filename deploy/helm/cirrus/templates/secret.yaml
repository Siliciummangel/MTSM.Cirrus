{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cirrus.secretName" . }}
  labels:
    {{- include "cirrus.labels" . | nindent 4 }}
type: Opaque
stringData:
  connection-string: {{ required "secrets.connectionString or secrets.existingSecret is required" .Values.secrets.connectionString | quote }}
  s3-access-key: {{ required "secrets.s3AccessKey or secrets.existingSecret is required" .Values.secrets.s3AccessKey | quote }}
  s3-secret-key: {{ required "secrets.s3SecretKey or secrets.existingSecret is required" .Values.secrets.s3SecretKey | quote }}
{{- end }}
