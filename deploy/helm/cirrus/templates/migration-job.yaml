apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "cirrus.fullname" . }}-migrate-{{ .Release.Revision }}
  labels:
    {{- include "cirrus.labels" . | nindent 4 }}
    app.kubernetes.io/component: migration
  annotations:
    "helm.sh/hook": {{ ternary "pre-install,pre-upgrade" "post-install,pre-upgrade" (not (empty .Values.secrets.existingSecret)) | quote }}
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "cirrus.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: migrate
          image: "{{ .Values.image.repositoryPrefix }}-migrate:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            readOnlyRootFilesystem: true
          env:
            - { name: DOTNET_ENVIRONMENT, value: Production }
            - name: ConnectionStrings__ArchiveDatabase
              valueFrom:
                secretKeyRef:
                  name: {{ include "cirrus.secretName" . }}
                  key: connection-string
          resources: {{ toYaml .Values.migration.resources | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
